<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PuTTY-WebKit Terminal</title>
  <link rel="stylesheet" href="xterm.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #181a1f;
      font-family: 'Cascadia Code', Consolas, 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }
    #app-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }
    #dock-root {
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      overflow: hidden;
      position: relative;
      background-color: #1e1e1e;
    }

    /* Split Container & Splitters */
    .split-container {
      display: flex;
      width: 100%;
      height: 100%;
      overflow: hidden;
      flex: 1;
    }
    .split-row {
      flex-direction: row;
    }
    .split-column {
      flex-direction: column;
    }
    .split-child {
      display: flex;
      overflow: hidden;
      position: relative;
      min-width: 80px;
      min-height: 60px;
    }

    .splitter {
      background-color: #14161a;
      z-index: 100;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .splitter-row {
      width: 5px;
      height: 100%;
      cursor: col-resize;
    }
    .splitter-column {
      height: 5px;
      width: 100%;
      cursor: row-resize;
    }
    .splitter:hover, .splitter.dragging {
      background-color: #61afef !important;
    }

    /* Group Container */
    .dock-group {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      background-color: #1e1e1e;
      flex: 1;
      border: 1px solid transparent;
    }
    .dock-group.active {
      border-color: #2c313a;
    }

    /* Tab Bar */
    .group-tab-bar {
      display: flex;
      align-items: stretch;
      height: 32px;
      background-color: #181a1f;
      border-bottom: 1px solid #101216;
      user-select: none;
      padding: 0 4px;
      position: relative;
    }

    .group-tabs-list {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      overflow-x: auto;
      flex: 1;
      height: 100%;
      scrollbar-width: none;
      position: relative;
    }
    .group-tabs-list::-webkit-scrollbar {
      display: none;
    }

    .tab-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 10px 0 12px;
      height: 28px;
      border-radius: 6px 6px 0 0;
      background-color: #21252b;
      color: #9da5b4;
      font-size: 12px;
      cursor: grab;
      max-width: 260px;
      min-width: 80px;
      transition: background 0.15s, color 0.15s, opacity 0.15s;
      border: 1px solid transparent;
      border-bottom: none;
      position: relative;
    }
    .tab-item:active {
      cursor: grabbing;
    }
    .tab-item.dragging {
      opacity: 0.35;
    }
    .tab-item:hover {
      background-color: #282c34;
      color: #abb2bf;
    }
    .tab-item.active {
      background-color: #1e1e1e;
      color: #ffffff;
      border-color: #282c34;
      border-top: 2px solid #61afef;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #98c379;
      display: inline-block;
      box-shadow: 0 0 5px rgba(152, 195, 121, 0.6);
      flex-shrink: 0;
    }
    .status-dot.disconnected {
      background-color: #e06c75;
      box-shadow: 0 0 5px rgba(224, 108, 117, 0.6);
    }

    .tab-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      font-weight: 500;
    }

    .tab-close {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 3px;
      font-size: 14px;
      line-height: 1;
      color: #6e7687;
      opacity: 0.6;
      transition: all 0.15s;
      margin-left: 2px;
    }
    .tab-close:hover {
      background-color: #e06c75;
      color: #ffffff;
      opacity: 1;
    }

    /* Tab Insert Marker */
    .tab-insert-marker {
      position: absolute;
      top: 4px;
      bottom: 0;
      width: 2px;
      background-color: #61afef;
      box-shadow: 0 0 6px #61afef;
      display: none;
      pointer-events: none;
      z-index: 10;
    }

    /* Action buttons in pane header */
    .group-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      padding-left: 4px;
    }
    .btn-group-action {
      background: transparent;
      border: none;
      color: #6e7687;
      width: 24px;
      height: 24px;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s;
    }
    .btn-group-action:hover {
      background-color: #282c34;
      color: #61afef;
    }
    .btn-group-action.btn-new-tab {
      font-size: 16px;
    }
    .btn-group-action.btn-record-log {
      color: #9da5b4;
    }
    .btn-group-action.btn-record-log:hover {
      background-color: #282c34;
      color: #98c379;
    }
    .btn-group-action.btn-record-log.recording {
      color: #e06c75;
      background-color: rgba(224, 108, 117, 0.18);
      animation: record-pulse 1.8s infinite ease-in-out;
    }
    .btn-group-action.btn-record-log.recording:hover {
      background-color: rgba(224, 108, 117, 0.3);
      color: #ff4d4f;
    }
    .btn-group-action.btn-auto-reconnect {
      color: #9da5b4;
      border: 1px solid transparent;
      box-sizing: border-box;
    }
    .btn-group-action.btn-auto-reconnect:hover {
      background-color: #282c34;
      color: #61afef;
    }
    .btn-group-action.btn-auto-reconnect.active {
      background-color: #1a1d24;
      color: #61afef;
      border: 1px solid #3b4049;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(0, 0, 0, 0.5);
      transform: translateY(1px);
    }
    .btn-group-action.btn-auto-reconnect.active:hover {
      background-color: #16181e;
      color: #79c0ff;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.85);
    }
    .tab-item.recording .status-dot {
      background-color: #e06c75;
      box-shadow: 0 0 6px rgba(224, 108, 117, 0.9);
      animation: record-pulse 1.8s infinite ease-in-out;
    }
    @keyframes record-pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Group Content & Terminal Views */
    .group-content {
      flex: 1;
      width: 100%;
      height: calc(100% - 32px);
      position: relative;
      background-color: #1e1e1e;
      overflow: hidden;
    }

    .term-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 4px 6px 0 6px;
      display: none;
    }
    .term-view.active {
      display: block;
    }

    .xterm .xterm-viewport {
      overflow-y: auto;
    }

    /* Docking Overlay & 5-Zone Preview */
    .dock-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 500;
      display: none;
    }
    .dock-preview {
      position: absolute;
      background-color: rgba(97, 175, 239, 0.22);
      border: 2px dashed #61afef;
      border-radius: 4px;
      transition: top 0.08s ease-out, left 0.08s ease-out, width 0.08s ease-out, height 0.08s ease-out;
      pointer-events: none;
      box-shadow: inset 0 0 20px rgba(97, 175, 239, 0.15);
    }

    /* Context Menu */
    .context-menu {
      position: fixed;
      z-index: 10000;
      background-color: #21252b;
      border: 1px solid #3a3f4b;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      padding: 4px 0;
      min-width: 190px;
      font-size: 12px;
      color: #abb2bf;
      user-select: none;
    }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
    }
    .menu-item:hover {
      background-color: #2c313a;
      color: #ffffff;
    }
    .menu-item.danger:hover {
      background-color: #e06c75;
      color: #ffffff;
    }
    .menu-divider {
      height: 1px;
      background-color: #2c313a;
      margin: 4px 0;
    }

    /* Fix cursor visibility when background truecolor inline styles override xterm cursor */
    :root {
      --term-cursor: #ffffff;
      --term-cursor-accent: #1e1e1e;
    }
    .xterm .xterm-rows .xterm-cursor.xterm-cursor-block:not(.xterm-cursor-blink) {
      background-color: var(--term-cursor, #ffffff) !important;
      color: var(--term-cursor-accent, #1e1e1e) !important;
    }
    .xterm .xterm-rows .xterm-cursor.xterm-cursor-outline {
      outline: 1px solid var(--term-cursor, #ffffff) !important;
      outline-offset: -1px !important;
    }
    .xterm .xterm-rows .xterm-cursor.xterm-cursor-bar:not(.xterm-cursor-blink) {
      box-shadow: 2px 0 0 var(--term-cursor, #ffffff) inset !important;
    }
    .xterm .xterm-rows .xterm-cursor.xterm-cursor-underline:not(.xterm-cursor-blink) {
      border-bottom: 2px solid var(--term-cursor, #ffffff) !important;
    }
  </style>
</head>
<body>
  <div id="app-container">
    <div id="dock-root">
      <!-- Dynamic Docking Tree -->
    </div>
  </div>

  <!-- Custom Context Menu for Tabs -->
  <div id="tab-context-menu" class="context-menu" style="display: none;">
    <div class="menu-item" data-action="toggle-log">
      <span id="ctx-log-icon">▶</span> <span id="ctx-log-text">录制会话日志 (Record Log)</span>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-item" data-action="clone">
      <span>📑</span> 克隆当前会话 (Clone Session)
    </div>
    <div class="menu-item" data-action="split-right">
      <span>◫</span> 向右分屏 (Split Right)
    </div>
    <div class="menu-item" data-action="split-down">
      <span>⬒</span> 向下分屏 (Split Down)
    </div>
    <div class="menu-divider"></div>
    <div class="menu-item" data-action="new">
      <span>➕</span> 新建会话... (New Session...)
    </div>
    <div class="menu-item" data-action="detach">
      <span>⧉</span> 移动到新窗口 (Move to New Window)
    </div>
    <div class="menu-item" data-action="merge-all">
      <span>⇲</span> 合并所有窗口 (Merge All Windows)
    </div>
    <div class="menu-divider"></div>
    <div class="menu-item" data-action="rename">
      <span>✏️</span> 重命名标签 (Rename Tab)
    </div>
    <div class="menu-divider"></div>
    <div class="menu-item danger" data-action="close">
      <span>❌</span> 关闭标签 (Close Tab)
    </div>
  </div>

  <script src="xterm.js"></script>
  <script src="xterm-addon-fit.js"></script>
  <script src="xterm-addon-web-links.js"></script>
  <script>
    const termTheme = {
      background: '#1e1e1e',
      foreground: '#d4d4d4',
      cursor: '#ffffff',
      cursorAccent: '#1e1e1e',
      selectionBackground: '#264f78',
      black: '#000000',
      red: '#cd3131',
      green: '#0dbc79',
      yellow: '#e5e510',
      blue: '#2472c8',
      magenta: '#bc3fbc',
      cyan: '#11a8cd',
      white: '#e5e5e5',
      brightBlack: '#666666',
      brightRed: '#f14c4c',
      brightGreen: '#23d18b',
      brightYellow: '#f5f543',
      brightBlue: '#3b8eea',
      brightMagenta: '#d670d6',
      brightCyan: '#29b8db',
      brightWhite: '#e5e5e5'
    };

    function sendToHost(type, data) {
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage(type + data);
      }
    }

    const sessions = {}; // id -> { id, title, term, fitAddon, viewEl, tabEl, titleEl, dotEl, connected, groupId }
    let activeGlobalSessionId = null;
    let contextMenuTargetId = null;
    const contextMenuEl = document.getElementById('tab-context-menu');

    // Dock Manager handles VS Code-like multi-group split panes, docking, and dragging
    class DockManager {
      constructor(rootEl) {
        this.rootEl = rootEl;
        this.groups = {}; // groupId -> { id, sessionIds: [], activeSessionId, groupEl, tabsListEl, contentEl, overlayEl, previewEl, insertMarkerEl }
        this.nextGroupId = 1;
        this.activeGroupId = null;
        this.draggedSessionId = null;

        // Initialize root group
        const initialGroup = this.createGroupNode();
        this.rootEl.appendChild(initialGroup.groupEl);
        this.activeGroupId = initialGroup.id;
      }

      createGroupNode() {
        const gid = this.nextGroupId++;
        const groupEl = document.createElement('div');
        groupEl.className = 'dock-group';
        groupEl.id = `dock-group-${gid}`;
        groupEl.dataset.groupId = gid;

        // Tab bar
        const tabBarEl = document.createElement('div');
        tabBarEl.className = 'group-tab-bar';

        const tabsListEl = document.createElement('div');
        tabsListEl.className = 'group-tabs-list';

        const insertMarkerEl = document.createElement('div');
        insertMarkerEl.className = 'tab-insert-marker';
        tabsListEl.appendChild(insertMarkerEl);

        const actionsEl = document.createElement('div');
        actionsEl.className = 'group-actions';

        const btnRecordLog = document.createElement('button');
        btnRecordLog.tabIndex = -1;
        btnRecordLog.className = 'btn-group-action btn-record-log';
        btnRecordLog.innerHTML = '<svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>';
        btnRecordLog.title = '录制会话日志 (Record Log)';
        btnRecordLog.addEventListener('click', (e) => {
          e.stopPropagation();
          const g = this.groups[gid];
          if (g && g.activeSessionId) {
            sendToHost('3', `${g.activeSessionId}:toggle_log`);
            if (sessions[g.activeSessionId]) {
              sessions[g.activeSessionId].term.focus();
            }
          }
        });

        const btnAutoReconnect = document.createElement('button');
        btnAutoReconnect.tabIndex = -1;
        btnAutoReconnect.className = 'btn-group-action btn-auto-reconnect';
        btnAutoReconnect.innerHTML = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>';
        btnAutoReconnect.title = '自动重连 (Auto Reconnect)';
        btnAutoReconnect.addEventListener('click', (e) => {
          e.stopPropagation();
          const g = this.groups[gid];
          if (g && g.activeSessionId) {
            sendToHost('3', `${g.activeSessionId}:toggle_auto_reconnect`);
            if (sessions[g.activeSessionId]) {
              sessions[g.activeSessionId].term.focus();
            }
          }
        });

        const btnNewTab = document.createElement('button');
        btnNewTab.tabIndex = -1;
        btnNewTab.className = 'btn-group-action btn-new-tab';
        btnNewTab.innerHTML = '+';
        btnNewTab.title = '新建会话 (New Session)';
        btnNewTab.addEventListener('click', (e) => {
          e.stopPropagation();
          this.setActiveGroup(gid);
          sendToHost('3', 'new_tab');
        });

        actionsEl.appendChild(btnRecordLog);
        actionsEl.appendChild(btnAutoReconnect);
        actionsEl.appendChild(btnNewTab);

        tabBarEl.appendChild(tabsListEl);
        tabBarEl.appendChild(actionsEl);

        // Content Area
        const contentEl = document.createElement('div');
        contentEl.className = 'group-content';

        // Docking 5-Zone Preview Overlay
        const overlayEl = document.createElement('div');
        overlayEl.className = 'dock-overlay';
        const previewEl = document.createElement('div');
        previewEl.className = 'dock-preview';
        overlayEl.appendChild(previewEl);
        contentEl.appendChild(overlayEl);

        groupEl.appendChild(tabBarEl);
        groupEl.appendChild(contentEl);

        // Attach Drag & Drop handlers to this group
        this.setupGroupDropEvents(gid, tabsListEl, contentEl, overlayEl, previewEl, insertMarkerEl);

        groupEl.addEventListener('mousedown', () => {
          this.setActiveGroup(gid);
        });

        const groupObj = {
          id: gid,
          sessionIds: [],
          activeSessionId: null,
          groupEl,
          tabsListEl,
          contentEl,
          overlayEl,
          previewEl,
          insertMarkerEl,
          btnRecordLog,
          btnAutoReconnect
        };

        this.groups[gid] = groupObj;
        return groupObj;
      }

      setupGroupDropEvents(gid, tabsListEl, contentEl, overlayEl, previewEl, insertMarkerEl) {
        const isTabDrag = e => {
          return this.draggedSessionId || (e.dataTransfer && (
            e.dataTransfer.types.includes('application/x-putty-tab') ||
            e.dataTransfer.types.includes('text/plain')
          ));
        };

        const extractDroppedSid = e => {
          if (this.draggedSessionId) return this.draggedSessionId;
          if (e.dataTransfer) {
            const custom = e.dataTransfer.getData('application/x-putty-tab');
            if (custom) return parseInt(custom, 10);
            const plain = e.dataTransfer.getData('text/plain');
            if (plain && plain.startsWith('putty-tab:')) return parseInt(plain.split(':')[1], 10);
            if (plain && /^\d+$/.test(plain.trim())) return parseInt(plain.trim(), 10);
          }
          return null;
        };

        // Tab Bar Drop: Reordering or Cross-Window Drag-in
        tabsListEl.addEventListener('dragover', e => {
          if (!isTabDrag(e)) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';

          overlayEl.style.display = 'none';

          const tabs = Array.from(tabsListEl.querySelectorAll('.tab-item:not(.dragging)'));
          let insertBeforeTab = null;
          let markerX = 0;

          for (const tab of tabs) {
            const rect = tab.getBoundingClientRect();
            const mid = rect.left + rect.width / 2;
            if (e.clientX < mid) {
              insertBeforeTab = tab;
              markerX = rect.left - tabsListEl.getBoundingClientRect().left;
              break;
            } else {
              markerX = rect.right - tabsListEl.getBoundingClientRect().left;
            }
          }

          insertMarkerEl.style.display = 'block';
          insertMarkerEl.style.left = `${Math.max(2, markerX)}px`;
        });

        tabsListEl.addEventListener('dragleave', e => {
          if (!tabsListEl.contains(e.relatedTarget)) {
            insertMarkerEl.style.display = 'none';
          }
        });

        tabsListEl.addEventListener('drop', e => {
          e.preventDefault();
          insertMarkerEl.style.display = 'none';

          const sid = extractDroppedSid(e);
          if (!sid) return;

          if (sessions[sid]) {
            const targetSessionId = this.findTargetTabSessionId(e.target);
            this.moveSessionToGroup(sid, gid, targetSessionId);
          } else {
            // Cross-window drag: attach to this window and group
            this.pendingAttachGroupId = gid;
            sendToHost('3', `${sid}:attach`);
          }
        });

        // Content Area Drop: 5-Zone Docking or Cross-Window Split
        contentEl.addEventListener('dragover', e => {
          if (!isTabDrag(e)) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';

          const rect = contentEl.getBoundingClientRect();
          const zone = this.calculateDockZone(e, rect);

          overlayEl.style.display = 'block';
          this.renderDockPreview(previewEl, zone);
        });

        contentEl.addEventListener('dragleave', e => {
          if (!contentEl.contains(e.relatedTarget)) {
            overlayEl.style.display = 'none';
          }
        });

        contentEl.addEventListener('drop', e => {
          e.preventDefault();
          overlayEl.style.display = 'none';

          const sid = extractDroppedSid(e);
          if (!sid) return;

          const rect = contentEl.getBoundingClientRect();
          const zone = this.calculateDockZone(e, rect);

          if (sessions[sid]) {
            if (zone === 'center') {
              this.moveSessionToGroup(sid, gid);
            } else if (zone === 'left') {
              this.splitGroup(gid, 'row', sid, true);
            } else if (zone === 'right') {
              this.splitGroup(gid, 'row', sid, false);
            } else if (zone === 'top') {
              this.splitGroup(gid, 'column', sid, true);
            } else if (zone === 'bottom') {
              this.splitGroup(gid, 'column', sid, false);
            }
          } else {
            // Cross-window drop into docking zone
            if (zone === 'center') {
              this.pendingAttachGroupId = gid;
            } else if (zone === 'left') {
              this.pendingAttachSplit = { gid, direction: 'row', before: true };
            } else if (zone === 'right') {
              this.pendingAttachSplit = { gid, direction: 'row', before: false };
            } else if (zone === 'top') {
              this.pendingAttachSplit = { gid, direction: 'column', before: true };
            } else if (zone === 'bottom') {
              this.pendingAttachSplit = { gid, direction: 'column', before: false };
            }
            sendToHost('3', `${sid}:attach`);
          }
        });
      }

      findTargetTabSessionId(element) {
        const tab = element.closest('.tab-item');
        if (tab && tab.dataset.sessionId) {
          return parseInt(tab.dataset.sessionId, 10);
        }
        return null;
      }

      calculateDockZone(e, rect) {
        const relX = (e.clientX - rect.left) / rect.width;
        const relY = (e.clientY - rect.top) / rect.height;
        const edgeThresh = 0.28;

        if (relX < edgeThresh) return 'left';
        if (relX > 1 - edgeThresh) return 'right';
        if (relY < edgeThresh) return 'top';
        if (relY > 1 - edgeThresh) return 'bottom';
        return 'center';
      }

      renderDockPreview(previewEl, zone) {
        if (zone === 'left') {
          previewEl.style.top = '0';
          previewEl.style.left = '0';
          previewEl.style.width = '50%';
          previewEl.style.height = '100%';
        } else if (zone === 'right') {
          previewEl.style.top = '0';
          previewEl.style.left = '50%';
          previewEl.style.width = '50%';
          previewEl.style.height = '100%';
        } else if (zone === 'top') {
          previewEl.style.top = '0';
          previewEl.style.left = '0';
          previewEl.style.width = '100%';
          previewEl.style.height = '50%';
        } else if (zone === 'bottom') {
          previewEl.style.top = '50%';
          previewEl.style.left = '0';
          previewEl.style.width = '100%';
          previewEl.style.height = '50%';
        } else {
          previewEl.style.top = '0';
          previewEl.style.left = '0';
          previewEl.style.width = '100%';
          previewEl.style.height = '100%';
        }
      }

      setActiveGroup(gid) {
        if (!this.groups[gid]) return;
        if (this.activeGroupId && this.groups[this.activeGroupId]) {
          this.groups[this.activeGroupId].groupEl.classList.remove('active');
        }
        this.activeGroupId = gid;
        const g = this.groups[gid];
        g.groupEl.classList.add('active');

        if (g.activeSessionId && sessions[g.activeSessionId]) {
          activeGlobalSessionId = g.activeSessionId;
          document.title = `${sessions[g.activeSessionId].title} - PuTTY-WebKit`;
        }
      }

      addSessionToGroup(sid, targetGid, beforeSid = null) {
        const sess = sessions[sid];
        if (!sess) return;

        // Remove from current group if any
        if (sess.groupId && this.groups[sess.groupId]) {
          const oldG = this.groups[sess.groupId];
          oldG.sessionIds = oldG.sessionIds.filter(id => id !== sid);
          sess.tabEl.remove();
          sess.viewEl.remove();

          if (oldG.activeSessionId === sid) {
            if (oldG.sessionIds.length > 0) {
              this.switchGroupTab(oldG.id, oldG.sessionIds[oldG.sessionIds.length - 1]);
            } else {
              oldG.activeSessionId = null;
            }
          }
          this.checkAndCleanupGroup(oldG.id);
        }

        // Add to new group
        let g = this.groups[targetGid];
        if (!g) {
          targetGid = Object.keys(this.groups)[0];
          g = this.groups[targetGid];
        }

        sess.groupId = g.id;

        if (beforeSid && g.sessionIds.includes(beforeSid)) {
          const idx = g.sessionIds.indexOf(beforeSid);
          g.sessionIds.splice(idx, 0, sid);
          const beforeTab = g.tabsListEl.querySelector(`#tab-${beforeSid}`);
          if (beforeTab) {
            g.tabsListEl.insertBefore(sess.tabEl, beforeTab);
          } else {
            g.tabsListEl.appendChild(sess.tabEl);
          }
        } else {
          g.sessionIds.push(sid);
          g.tabsListEl.appendChild(sess.tabEl);
        }

        g.contentEl.appendChild(sess.viewEl);
        this.setActiveGroup(g.id);
        this.switchGroupTab(g.id, sid);
      }

      moveSessionToGroup(sid, targetGid, beforeSid = null) {
        this.addSessionToGroup(sid, targetGid, beforeSid);
      }

      switchGroupTab(gid, sid) {
        const g = this.groups[gid];
        if (!g || !sessions[sid]) return;

        // Deactivate previous active in this group
        if (g.activeSessionId && sessions[g.activeSessionId]) {
          sessions[g.activeSessionId].tabEl.classList.remove('active');
          sessions[g.activeSessionId].viewEl.classList.remove('active');
        }

        g.activeSessionId = sid;
        this.setActiveGroup(gid);

        const cur = sessions[sid];
        cur.tabEl.classList.add('active');
        cur.viewEl.classList.add('active');
        activeGlobalSessionId = sid;
        document.title = `${cur.title} - PuTTY-WebKit`;

        this.updateGroupLogButton(gid);
        this.updateGroupAutoReconnectButton(gid);

        setTimeout(() => {
          syncSessionSize(sid);
          cur.term.focus();
        }, 25);
      }

      updateGroupLogButton(gid) {
        const g = this.groups[gid];
        if (!g || !g.btnRecordLog) return;
        const sid = g.activeSessionId;
        const s = sid ? sessions[sid] : null;
        if (s && s.isLogging) {
          g.btnRecordLog.classList.add('recording');
          g.btnRecordLog.innerHTML = '<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>';
          g.btnRecordLog.title = `正在录制日志: ${s.logFilename || ''} (点击停止录制)`;
        } else {
          g.btnRecordLog.classList.remove('recording');
          g.btnRecordLog.innerHTML = '<svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>';
          g.btnRecordLog.title = '录制会话日志 (Record Log)';
        }
      }

      updateAllGroupLogButtons() {
        for (const gid in this.groups) {
          this.updateGroupLogButton(gid);
        }
      }

      updateGroupAutoReconnectButton(gid) {
        const g = this.groups[gid];
        if (!g || !g.btnAutoReconnect) return;
        const sid = g.activeSessionId;
        const s = sid ? sessions[sid] : null;
        if (s && s.autoReconnect) {
          g.btnAutoReconnect.classList.add('active');
          g.btnAutoReconnect.title = '自动重连已开启 (点击关闭)';
        } else {
          g.btnAutoReconnect.classList.remove('active');
          g.btnAutoReconnect.title = '自动重连已关闭 (点击开启)';
        }
      }

      updateAllGroupAutoReconnectButtons() {
        for (const gid in this.groups) {
          this.updateGroupAutoReconnectButton(gid);
        }
      }

      splitGroup(sourceGid, direction, movingSessionId, placeFirst = false) {
        const sourceGroup = this.groups[sourceGid];
        if (!sourceGroup) return;

        // Create new group
        const newGroup = this.createGroupNode();

        // Create split container
        const splitContainer = document.createElement('div');
        splitContainer.className = `split-container split-${direction}`;

        const childA = document.createElement('div');
        childA.className = 'split-child';
        childA.style.flex = '50 1 0px';

        const splitter = document.createElement('div');
        splitter.className = `splitter splitter-${direction}`;

        const childB = document.createElement('div');
        childB.className = 'split-child';
        childB.style.flex = '50 1 0px';

        // Replace sourceGroup in DOM with splitContainer
        const parent = sourceGroup.groupEl.parentElement;
        parent.insertBefore(splitContainer, sourceGroup.groupEl);

        if (placeFirst) {
          childA.appendChild(newGroup.groupEl);
          childB.appendChild(sourceGroup.groupEl);
        } else {
          childA.appendChild(sourceGroup.groupEl);
          childB.appendChild(newGroup.groupEl);
        }

        splitContainer.appendChild(childA);
        splitContainer.appendChild(splitter);
        splitContainer.appendChild(childB);

        // Setup resizable splitter
        this.setupSplitterDragging(splitter, childA, childB, direction === 'row');

        // Move session into new group
        this.addSessionToGroup(movingSessionId, newGroup.id);

        setTimeout(() => {
          syncAllSizes();
        }, 30);
      }

      setupSplitterDragging(splitter, prevChild, nextChild, isRow) {
        splitter.addEventListener('mousedown', e => {
          e.preventDefault();
          splitter.classList.add('dragging');

          const startCoord = isRow ? e.clientX : e.clientY;
          const prevRect = prevChild.getBoundingClientRect();
          const nextRect = nextChild.getBoundingClientRect();
          const totalPx = isRow ? (prevRect.width + nextRect.width) : (prevRect.height + nextRect.height);
          const startPrevPx = isRow ? prevRect.width : prevRect.height;

          // Transparent glass overlay prevents iframe/xterm stealing mouse events
          const overlay = document.createElement('div');
          overlay.style.cssText = `position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;cursor:${isRow ? 'col-resize' : 'row-resize'};`;
          document.body.appendChild(overlay);

          function onMouseMove(moveEvent) {
            const currentCoord = isRow ? moveEvent.clientX : moveEvent.clientY;
            const delta = currentCoord - startCoord;
            let newPrevPx = startPrevPx + delta;
            const minPx = 70;
            if (newPrevPx < minPx) newPrevPx = minPx;
            if (newPrevPx > totalPx - minPx) newPrevPx = totalPx - minPx;

            const prevRatio = newPrevPx / totalPx;
            const nextRatio = 1 - prevRatio;
            prevChild.style.flex = `${prevRatio * 100} 1 0px`;
            nextChild.style.flex = `${nextRatio * 100} 1 0px`;

            syncAllSizes();
          }

          function onMouseUp() {
            splitter.classList.remove('dragging');
            overlay.remove();
            window.removeEventListener('mousemove', onMouseMove);
            window.removeEventListener('mouseup', onMouseUp);
            syncAllSizes();
          }

          window.addEventListener('mousemove', onMouseMove);
          window.addEventListener('mouseup', onMouseUp);
        });
      }

      checkAndCleanupGroup(gid) {
        const g = this.groups[gid];
        if (!g) return;

        if (g.sessionIds.length === 0) {
          const splitChild = g.groupEl.parentElement;
          if (splitChild && splitChild.classList.contains('split-child')) {
            const splitContainer = splitChild.parentElement;
            if (splitContainer && splitContainer.classList.contains('split-container')) {
              // Find sibling
              const allChildren = Array.from(splitContainer.children);
              const siblingChild = allChildren.find(c => c !== splitChild && c.classList.contains('split-child'));

              if (siblingChild && siblingChild.firstElementChild) {
                const survivingNode = siblingChild.firstElementChild;
                const grandParent = splitContainer.parentElement;
                grandParent.insertBefore(survivingNode, splitContainer);
                splitContainer.remove();
              }
            }
          }

          try {
            g.groupEl.remove();
          } catch (e) {}

          // If this was active group, activate another one
          delete this.groups[gid];
          const remainingGids = Object.keys(this.groups);
          if (remainingGids.length > 0) {
            const nextGid = parseInt(remainingGids[0], 10);
            this.setActiveGroup(nextGid);
            const nextG = this.groups[nextGid];
            if (nextG && nextG.activeSessionId && sessions[nextG.activeSessionId]) {
              this.switchGroupTab(nextGid, nextG.activeSessionId);
            }
          } else {
            // Re-create a default group
            const defaultG = this.createGroupNode();
            this.rootEl.appendChild(defaultG.groupEl);
            this.activeGroupId = defaultG.id;
          }

          setTimeout(syncAllSizes, 30);
        }
      }
    }

    const dockManager = new DockManager(document.getElementById('dock-root'));

    // Heuristic Working Directory Detection for SSH / Serial / Terminal
    function inferDirFromPrompt(text) {
      if (!text) return null;
      text = text.trim();
      text = text.replace(/\x1b\[[0-9;]*[a-zA-Z]/g, '');

      // Pattern 1: user@host:path[$#%>] (e.g. root@OpenWrt:/etc/config# or user@box:~/work$)
      let m = text.match(/[\w\.-]+@[\w\.-]+:\s*([~/\w\.-]+(?:[ /][\w\.-]+)*)\s*[$#%>]/);
      if (m && /[~/]/.test(m[1])) return m[1].trim();

      // Pattern 2: [user@host path][$#%>] (e.g. [root@centos-server /var/log]#)
      m = text.match(/\[[\w\.-]+@[\w\.-]+\s+([~/\w\.-]+)\]\s*[$#%>]/);
      if (m && /[~/]/.test(m[1])) return m[1].trim();

      // Pattern 3: Prefix followed by :dir[$#%>]
      m = text.match(/:\s*([~/\w\.-]+)\s*[$#%>]\s*$/);
      if (m && /[~/]/.test(m[1])) return m[1].trim();

      // Pattern 4: BusyBox / embedded serial: /path # or ~/path $
      m = text.match(/^([~/\\][\w\.-]*(?:\/[\w\.-]+)*)\s*[$#%>]\s*$/);
      if (m) return m[1].trim();

      // Pattern 5: Windows / PowerShell: C:\path\dir> or PS C:\path\dir>
      m = text.match(/(?:PS\s+)?([A-Za-z]:\\[^>]*)\s*>/);
      if (m) return m[1].trim();

      return null;
    }

    function extractDirFromOsc7(data) {
      if (!data) return null;
      let p = data.replace(/^file:\/\/[^\/]*\//, '/');
      try {
        p = decodeURIComponent(p);
      } catch (e) {}
      return p;
    }

    function updateSessionDir(id, dir) {
      const s = sessions[id];
      if (!s) return;
      if (s.currentDir === dir) return;
      s.currentDir = dir;

      const displayTitle = dir ? `${s.baseTitle} (${dir})` : s.baseTitle;
      s.title = displayTitle;
      s.titleEl.textContent = displayTitle;
      s.tabEl.title = dir ? `会话: ${s.baseTitle}\n当前目录: ${dir}` : s.baseTitle;

      if (activeGlobalSessionId === id) {
        document.title = `${displayTitle} - PuTTY-WebKit`;
      }
    }

    function checkTerminalPrompt(s) {
      if (!s || !s.term || !s.term.buffer || !s.term.buffer.active) return;
      const buffer = s.term.buffer.active;
      const cursorY = buffer.cursorY + buffer.baseY;

      let line = buffer.getLine(cursorY);
      let lineStr = line ? line.translateToString(true) : '';
      let dir = inferDirFromPrompt(lineStr);

      if (!dir && cursorY > 0) {
        let prevLine = buffer.getLine(cursorY - 1);
        let prevStr = prevLine ? prevLine.translateToString(true) : '';
        dir = inferDirFromPrompt(prevStr);
      }

      if (dir && dir !== s.currentDir) {
        updateSessionDir(s.id, dir);
      }
    }

    function createSessionTab(id, title) {
      if (sessions[id]) return sessions[id];

      // 1. Tab DOM
      const tabEl = document.createElement('div');
      tabEl.className = 'tab-item';
      tabEl.id = `tab-${id}`;
      tabEl.dataset.sessionId = id;
      tabEl.setAttribute('draggable', 'true');

      const dotEl = document.createElement('span');
      dotEl.className = 'status-dot';

      const titleEl = document.createElement('span');
      titleEl.className = 'tab-title';
      titleEl.textContent = title || `Session ${id}`;

      const closeEl = document.createElement('span');
      closeEl.className = 'tab-close';
      closeEl.textContent = '×';
      closeEl.title = 'Close Tab';

      tabEl.appendChild(dotEl);
      tabEl.appendChild(titleEl);
      tabEl.appendChild(closeEl);

      // 2. View DOM
      const viewEl = document.createElement('div');
      viewEl.className = 'term-view';
      viewEl.id = `term-view-${id}`;

      // 3. xterm.js setup
      const term = new Terminal({
        theme: termTheme,
        fontFamily: "'Cascadia Code', Consolas, 'Segoe UI', monospace",
        fontSize: 14,
        lineHeight: 1.15,
        cursorBlink: true,
        cursorStyle: 'block',
        allowProposedApi: true,
        scrollback: 10000
      });

      const fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);

      if (window.WebLinksAddon) {
        term.loadAddon(new WebLinksAddon.WebLinksAddon());
      }

      term.open(viewEl);

      // Focus terminal on click/mousedown
      viewEl.addEventListener('mousedown', () => {
        term.focus();
      });

      // Keystroke input
      term.onData(data => {
        sendToHost('0', `${id}:${data}`);
      });

      // Mouse selection copy (PuTTY classic behavior: copy on mouse release)
      viewEl.addEventListener('mouseup', () => {
        setTimeout(() => {
          const selection = term.getSelection();
          if (selection && selection.length > 0) {
            sendToHost('4', selection);
          }
        }, 10);
      });

      // Quick right-click paste (PuTTY classic behavior)
      viewEl.addEventListener('contextmenu', e => {
        e.preventDefault();
        sendToHost('3', `${id}:paste`);
      });

      // Middle-click paste
      viewEl.addEventListener('auxclick', e => {
        if (e.button === 1) {
          e.preventDefault();
          sendToHost('3', `${id}:paste`);
        }
      });

      // Terminal keyboard shortcuts (Shift+Insert / Ctrl+Shift+V for paste, Ctrl+Shift+C for copy)
      term.attachCustomKeyEventHandler(e => {
        if (e.type === 'keydown') {
          if (e.shiftKey && e.key === 'Insert') {
            sendToHost('3', `${id}:paste`);
            return false;
          }
          if (e.ctrlKey && e.shiftKey && (e.key === 'V' || e.key === 'v')) {
            sendToHost('3', `${id}:paste`);
            return false;
          }
          if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c')) {
            const sel = term.getSelection();
            if (sel) {
              sendToHost('4', sel);
            }
            return false;
          }
        }
        return true;
      });

      // Tab click -> switch to this tab in its group
      tabEl.addEventListener('click', () => {
        const sess = sessions[id];
        if (sess && sess.groupId) {
          dockManager.switchGroupTab(sess.groupId, id);
        }
      });

      // Tab close click -> close session
      closeEl.addEventListener('click', e => {
        e.stopPropagation();
        sendToHost('3', `${id}:close`);
      });

      // Tab right-click -> show context menu
      tabEl.addEventListener('contextmenu', e => {
        e.preventDefault();
        e.stopPropagation();
        showContextMenu(e, id);
      });

      // Tab HTML5 Dragging
      tabEl.addEventListener('dragstart', e => {
        dockManager.draggedSessionId = id;
        tabEl.classList.add('dragging');
        e.dataTransfer.setData('application/x-putty-tab', String(id));
        e.dataTransfer.setData('text/plain', `putty-tab:${id}`);
        e.dataTransfer.effectAllowed = 'move';
      });

      tabEl.addEventListener('dragend', e => {
        dockManager.draggedSessionId = null;
        tabEl.classList.remove('dragging');
        document.querySelectorAll('.dock-overlay').forEach(o => o.style.display = 'none');
        document.querySelectorAll('.tab-insert-marker').forEach(m => m.style.display = 'none');

        // Check if tab was dropped outside the current window onto the desktop (Tab Tear-off)
        const totalSessions = Object.keys(sessions).length;
        const droppedElsewhere = !e.dataTransfer || e.dataTransfer.dropEffect === 'none';
        if (totalSessions > 1 && droppedElsewhere && e.screenX && e.screenY) {
          const winX = window.screenX !== undefined ? window.screenX : window.screenLeft;
          const winY = window.screenY !== undefined ? window.screenY : window.screenTop;
          const winW = window.outerWidth;
          const winH = window.outerHeight;

          const isOutside = (
            e.screenX < winX ||
            e.screenX > winX + winW ||
            e.screenY < winY ||
            e.screenY > winY + winH
          );

          if (isOutside) {
            sendToHost('3', `${id}:detach:${e.screenX}:${e.screenY}`);
          }
        }
      });

      const sessionObj = {
        id,
        baseTitle: title || `Session ${id}`,
        title: title || `Session ${id}`,
        currentDir: null,
        term,
        fitAddon,
        viewEl,
        tabEl,
        titleEl,
        dotEl,
        connected: true,
        groupId: null,
        isLogging: false,
        logFilename: '',
        autoReconnect: false
      };

      // OSC 7 Current Working Directory support
      if (term.parser && term.parser.registerOscHandler) {
        try {
          term.parser.registerOscHandler(7, data => {
            const dir = extractDirFromOsc7(data);
            if (dir) {
              updateSessionDir(id, dir);
            }
            return true;
          });
        } catch (e) {}
      }

      // OSC 0 / OSC 2 Window Title support (e.g. bash / zsh PROMPT_COMMAND)
      term.onTitleChange(rawTitle => {
        const dir = inferDirFromPrompt(rawTitle);
        if (dir) {
          updateSessionDir(id, dir);
        }
      });

      // Prompt Heuristic Detection for SSH / Serial consoles without OSC
      let promptTimer = null;
      const schedulePromptCheck = () => {
        if (promptTimer) clearTimeout(promptTimer);
        promptTimer = setTimeout(() => {
          checkTerminalPrompt(sessionObj);
        }, 120);
      };
      sessionObj.schedulePromptCheck = schedulePromptCheck;

      term.onLineFeed(schedulePromptCheck);
      term.onCursorMove(schedulePromptCheck);

      sessions[id] = sessionObj;

      // Add to current active or pending group
      const targetGid = dockManager.pendingAttachGroupId || dockManager.activeGroupId || Object.keys(dockManager.groups)[0];
      dockManager.pendingAttachGroupId = null;
      dockManager.addSessionToGroup(id, targetGid);

      if (dockManager.pendingAttachSplit) {
        const splitInfo = dockManager.pendingAttachSplit;
        dockManager.pendingAttachSplit = null;
        setTimeout(() => {
          dockManager.splitGroup(splitInfo.gid, splitInfo.direction, id, splitInfo.before);
        }, 50);
      }

      setTimeout(() => {
        term.focus();
      }, 30);

      return sessionObj;
    }

    function removeSessionTab(id) {
      if (!sessions[id]) return;

      const cur = sessions[id];
      const gid = cur.groupId;

      try {
        cur.term.dispose();
      } catch (e) {}

      cur.tabEl.remove();
      cur.viewEl.remove();
      delete sessions[id];

      if (gid && dockManager.groups[gid]) {
        const g = dockManager.groups[gid];
        g.sessionIds = g.sessionIds.filter(x => x !== id);
        if (g.activeSessionId === id) {
          if (g.sessionIds.length > 0) {
            dockManager.switchGroupTab(gid, g.sessionIds[g.sessionIds.length - 1]);
          } else {
            g.activeSessionId = null;
          }
        }
        dockManager.checkAndCleanupGroup(gid);
      }

      // If the closed tab was global active session, focus remaining active session
      if (activeGlobalSessionId === id) {
        const remainingIds = Object.keys(sessions);
        if (remainingIds.length > 0) {
          const nextId = parseInt(remainingIds[remainingIds.length - 1], 10);
          const nextSess = sessions[nextId];
          if (nextSess && nextSess.groupId) {
            dockManager.switchGroupTab(nextSess.groupId, nextId);
          }
        } else {
          activeGlobalSessionId = null;
          document.title = 'PuTTY-WebKit';
        }
      }
    }

    function syncSessionSize(id) {
      const s = sessions[id];
      if (!s) return;
      try {
        s.fitAddon.fit();
        const dims = { cols: s.term.cols, rows: s.term.rows };
        sendToHost('1', `${id}:${JSON.stringify(dims)}`);
      } catch (e) {}
    }

    function syncAllSizes() {
      for (const gid in dockManager.groups) {
        const g = dockManager.groups[gid];
        if (g.activeSessionId && sessions[g.activeSessionId]) {
          syncSessionSize(g.activeSessionId);
        }
      }
    }

    window.addEventListener('resize', () => {
      syncAllSizes();
    });

    // Context Menu handling
    function showContextMenu(e, id) {
      contextMenuTargetId = id;
      contextMenuEl.style.left = `${Math.min(e.clientX, window.innerWidth - 200)}px`;
      contextMenuEl.style.top = `${e.clientY + 5}px`;
      const s = sessions[id];
      const logText = document.getElementById('ctx-log-text');
      const logIcon = document.getElementById('ctx-log-icon');
      if (logText && logIcon) {
        if (s && s.isLogging) {
          logText.textContent = `停止录制日志 (${s.logFilename || 'Recording'})`;
          logIcon.innerHTML = '<svg viewBox="0 0 24 24" width="12" height="12" fill="#ff4d4f"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>';
        } else {
          logText.textContent = '录制会话日志 (Record Log)';
          logIcon.innerHTML = '▶';
        }
      }
      contextMenuEl.style.display = 'block';
    }

    document.addEventListener('click', () => {
      contextMenuEl.style.display = 'none';
    });

    contextMenuEl.addEventListener('click', e => {
      const item = e.target.closest('.menu-item');
      if (!item || !contextMenuTargetId) return;

      const action = item.getAttribute('data-action');
      const targetId = contextMenuTargetId;
      contextMenuEl.style.display = 'none';

      if (action === 'toggle-log') {
        sendToHost('3', `${targetId}:toggle_log`);
      } else if (action === 'clone') {
        sendToHost('3', `${targetId}:clone`);
      } else if (action === 'split-right') {
        const sess = sessions[targetId];
        if (sess && sess.groupId) {
          dockManager.splitGroup(sess.groupId, 'row', targetId, false);
        }
      } else if (action === 'split-down') {
        const sess = sessions[targetId];
        if (sess && sess.groupId) {
          dockManager.splitGroup(sess.groupId, 'column', targetId, false);
        }
      } else if (action === 'new') {
        sendToHost('3', 'new_tab');
      } else if (action === 'detach') {
        const totalSessions = Object.keys(sessions).length;
        if (totalSessions > 1) {
          const winX = (window.screenX !== undefined ? window.screenX : window.screenLeft) + 80;
          const winY = (window.screenY !== undefined ? window.screenY : window.screenTop) + 60;
          sendToHost('3', `${targetId}:detach:${winX}:${winY}`);
        } else {
          alert('当前窗口仅有一个标签页，无法移至新窗口。');
        }
      } else if (action === 'merge-all') {
        sendToHost('3', 'merge_all');
      } else if (action === 'rename') {
        const currentTitle = sessions[targetId] ? sessions[targetId].baseTitle : '';
        const newTitle = prompt('Rename Tab:', currentTitle);
        if (newTitle && newTitle.trim()) {
          if (sessions[targetId]) {
            sessions[targetId].baseTitle = newTitle.trim();
            updateSessionDir(targetId, sessions[targetId].currentDir);
          }
        }
      } else if (action === 'close') {
        sendToHost('3', `${targetId}:close`);
      }
    });

    // Incoming messages from C Host
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.addEventListener('message', event => {
        const msg = event.data;
        if (!msg || typeof msg !== 'string') return;
        const type = msg[0];
        const payload = msg.slice(1);

        if (type === 'T') {
          // New Tab creation: T{id}:{title}
          const colon = payload.indexOf(':');
          if (colon !== -1) {
            const id = parseInt(payload.slice(0, colon), 10);
            const title = payload.slice(colon + 1);
            createSessionTab(id, title);
          }
        } else if (type === 'X') {
          // Tab closed: X{id}
          removeSessionTab(parseInt(payload, 10));
        } else if (type === '0') {
          // Binary terminal data: 0{id}:{base64_data}
          const colon = payload.indexOf(':');
          if (colon !== -1) {
            const id = parseInt(payload.slice(0, colon), 10);
            const b64 = payload.slice(colon + 1);
            const s = sessions[id];
            if (s) {
              try {
                const binaryString = atob(b64);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                  bytes[i] = binaryString.charCodeAt(i);
                }
                s.term.write(bytes);
              } catch (e) {
                s.term.write(b64);
              }
              if (s.schedulePromptCheck) {
                s.schedulePromptCheck();
              }
            }
          }
        } else if (type === '1') {
          // Title update: 1{id}:{title}
          const colon = payload.indexOf(':');
          if (colon !== -1) {
            const id = parseInt(payload.slice(0, colon), 10);
            const title = payload.slice(colon + 1);
            if (sessions[id]) {
              sessions[id].baseTitle = title;
              updateSessionDir(id, sessions[id].currentDir);
            }
          }
        } else if (type === '2') {
          // Status update: 2{id}:{connected/disconnected}
          const colon = payload.indexOf(':');
          if (colon !== -1) {
            const id = parseInt(payload.slice(0, colon), 10);
            const status = payload.slice(colon + 1);
            if (sessions[id]) {
              if (status === 'disconnected') {
                sessions[id].connected = false;
                sessions[id].dotEl.classList.add('disconnected');
              } else {
                sessions[id].connected = true;
                sessions[id].dotEl.classList.remove('disconnected');
                syncSessionSize(id);
              }
            }
          }
        } else if (type === 'L') {
          // Log status update: L{id}:1:{filename} or L{id}:0
          const colon1 = payload.indexOf(':');
          if (colon1 !== -1) {
            const id = parseInt(payload.slice(0, colon1), 10);
            const rest = payload.slice(colon1 + 1);
            const colon2 = rest.indexOf(':');
            let isLogging = false;
            let filename = '';
            if (colon2 !== -1) {
              isLogging = rest.slice(0, colon2) === '1';
              filename = rest.slice(colon2 + 1);
            } else {
              isLogging = rest === '1';
            }
            if (sessions[id]) {
              sessions[id].isLogging = isLogging;
              sessions[id].logFilename = filename;
              if (isLogging) {
                sessions[id].tabEl.classList.add('recording');
              } else {
                sessions[id].tabEl.classList.remove('recording');
              }
              dockManager.updateAllGroupLogButtons();
            }
          }
        } else if (type === 'A') {
          // Auto reconnect status update: A{id}:1 or A{id}:0
          const colon = payload.indexOf(':');
          if (colon !== -1) {
            const id = parseInt(payload.slice(0, colon), 10);
            const enabled = payload.slice(colon + 1) === '1';
            if (sessions[id]) {
              sessions[id].autoReconnect = enabled;
              dockManager.updateAllGroupAutoReconnectButtons();
            }
          }
        }
      });

      // Window/Document focus routing: ensure active terminal is focused
      window.addEventListener('focus', () => {
        if (activeGlobalSessionId && sessions[activeGlobalSessionId]) {
          sessions[activeGlobalSessionId].term.focus();
        }
      });

      document.addEventListener('keydown', (e) => {
        if (activeGlobalSessionId && sessions[activeGlobalSessionId]) {
          const active = document.activeElement;
          if (!active || active === document.body || active.tagName === 'BUTTON') {
            sessions[activeGlobalSessionId].term.focus();
          }
        }
      });

      // Send initial handshake: frontend is ready
      sendToHost('R', '');
    }
  </script>
</body>
</html>
