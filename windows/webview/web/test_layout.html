<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PuTTY-WebView Milestone 1 Layout & Adversary Verification Suite</title>
  <link rel="stylesheet" href="xterm.css" />
  <style>
    :root {
      --bg-color: #1e1e2e;
      --card-bg: #252538;
      --card-border: #383852;
      --text-main: #cdd6f4;
      --text-muted: #a6adc8;
      --accent-pass: #a6e3a1;
      --accent-fail: #f38ba8;
      --accent-warn: #f9e2af;
      --accent-info: #89b4fa;
      --font-mono: 'Cascadia Code', Consolas, 'Segoe UI Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      overflow-y: scroll;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      color: var(--accent-info);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-m1 {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 4px;
      background-color: #313244;
      color: var(--accent-warn);
      border: 1px solid var(--card-border);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .toolbar {
      display: flex;
      gap: 12px;
    }

    button {
      background-color: #313244;
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }

    button:hover {
      background-color: #45475a;
      border-color: var(--accent-info);
    }

    button.primary {
      background-color: #89b4fa;
      color: #11111b;
      border-color: #89b4fa;
      font-weight: 600;
    }

    button.primary:hover {
      background-color: #b4befe;
    }

    /* Scoreboard */
    .scoreboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      font-family: var(--font-mono);
    }

    .stat-total { color: var(--text-main); }
    .stat-passed { color: var(--accent-pass); }
    .stat-failed { color: var(--accent-fail); }
    .stat-duration { color: var(--accent-warn); }

    /* Progress Bar */
    .progress-wrapper {
      height: 8px;
      background-color: #313244;
      border-radius: 4px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #89b4fa, #a6e3a1);
      transition: width 0.3s ease;
    }

    .progress-bar.has-failure {
      background: linear-gradient(90deg, #89b4fa, #f38ba8);
    }

    /* Suite Cards */
    .suite-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .suite-header {
      padding: 14px 18px;
      background-color: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .suite-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .suite-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    .badge-pass { background-color: rgba(166, 227, 161, 0.2); color: var(--accent-pass); }
    .badge-fail { background-color: rgba(243, 139, 168, 0.2); color: var(--accent-fail); }
    .badge-running { background-color: rgba(137, 180, 250, 0.2); color: var(--accent-info); }

    .test-list {
      list-style: none;
    }

    .test-item {
      padding: 12px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
    }

    .test-item:last-child {
      border-bottom: none;
    }

    .test-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .test-name {
      font-weight: 500;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .test-status {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
    }

    .status-pass { color: var(--accent-pass); }
    .status-fail { color: var(--accent-fail); }

    .test-meta {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      margin-left: 20px;
    }

    .test-details {
      margin-top: 6px;
      margin-left: 20px;
      background-color: #181825;
      border-radius: 6px;
      padding: 8px 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--accent-fail);
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* Terminal Sandbox Area */
    #sandbox-wrapper {
      margin-top: 32px;
      border: 1px dashed var(--card-border);
      border-radius: 8px;
      padding: 16px;
      background-color: #11111b;
    }

    #sandbox-header {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
      font-family: var(--font-mono);
    }

    #terminal-host {
      width: 640px;
      height: 280px;
      background-color: #000;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    /* VS Code Style Modern Scrollbar & Simulated Term View */
    .simulated-term-view {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 4px 0 0 8px;
      box-sizing: border-box;
      background-color: #1e1e1e;
      overflow: hidden;
    }

    .xterm .xterm-viewport::-webkit-scrollbar {
      width: 10px;
    }
    .xterm .xterm-viewport::-webkit-scrollbar-track {
      background: transparent;
    }
    .xterm .xterm-viewport::-webkit-scrollbar-thumb {
      background: rgba(121, 121, 121, 0.4);
      border-radius: 5px;
    }
    .xterm .xterm-viewport::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 100, 100, 0.7);
    }

    /* VS Code Style Modern Find Widget */
    .find-widget {
      position: absolute;
      top: 10px;
      right: 20px;
      z-index: 2000;
      background: #252526;
      border: 1px solid #3c3c3c;
      border-radius: 3px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      padding: 4px 6px;
      gap: 6px;
      font-size: 12px;
    }
    .find-widget.hidden {
      display: none !important;
    }
    .find-input-wrapper {
      display: flex;
      align-items: center;
      background: #3c3c3c;
      border: 1px solid transparent;
      border-radius: 2px;
      padding: 1px 4px;
    }
    .find-input-wrapper:focus-within {
      border-color: #007acc;
    }
    #find-input {
      background: transparent;
      border: none;
      outline: none;
      color: #cccccc;
      font-size: 12px;
      width: 140px;
      font-family: inherit;
    }
    .find-options, .find-actions {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .toggle-btn, .action-btn {
      background: transparent;
      border: none;
      color: #cccccc;
      padding: 2px 4px;
      border-radius: 2px;
      cursor: pointer;
      font-size: 11px;
      line-height: 1;
    }
    .toggle-btn:hover, .action-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .toggle-btn.active {
      background: #0e639c;
      color: #ffffff;
    }
    .find-status {
      color: #888888;
      font-size: 11px;
      margin: 0 4px;
      white-space: nowrap;
    }
  </style>

  <!-- xterm.js & Addons -->
  <script src="xterm.js"></script>
  <script src="xterm-addon-fit.js"></script>
  <script src="xterm-addon-unicode11.js"></script>
  <script src="xterm-addon-webgl.js"></script>
  <script src="xterm-addon-search.js"></script>
</head>
<body>

  <header>
    <h1>
      <span>PuTTY-WebView Layout Verification</span>
      <span class="badge-m1">Milestone 1 Gatekeeper QA</span>
    </h1>
    <div class="toolbar">
      <button id="btn-run" class="primary" onclick="window.runAllTests()">Run All Tests</button>
      <button onclick="window.copyJSONReport()">Copy JSON Report</button>
    </div>
  </header>

  <div class="scoreboard">
    <div class="stat-card">
      <div class="stat-label">Total Tests</div>
      <div id="stat-total" class="stat-value stat-total">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Passed</div>
      <div id="stat-passed" class="stat-value stat-passed">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Failed</div>
      <div id="stat-failed" class="stat-value stat-failed">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Execution Time</div>
      <div id="stat-duration" class="stat-value stat-duration">0ms</div>
    </div>
  </div>

  <div class="progress-wrapper">
    <div id="progress-bar" class="progress-bar"></div>
  </div>

  <div id="suites-container"></div>

  <div id="sandbox-wrapper">
    <div id="sandbox-header">Live Terminal Test Host (Sandboxed)</div>
    <div id="terminal-host"></div>
  </div>

  <pre id="test-results-json" style="display:none;"></pre>

  <script>
    // --- QA Assertions & Framework ---
    class TestSuite {
      constructor(id, title) {
        this.id = id;
        this.title = title;
        this.tests = [];
        this.status = 'PENDING';
      }

      addTest(name, fn) {
        this.tests.push({ name, fn, status: 'PENDING', error: null, duration: 0, details: [] });
      }

      async run(onUpdate) {
        this.status = 'RUNNING';
        let allPass = true;
        for (const t of this.tests) {
          const start = performance.now();
          t.details = [];
          try {
            await t.fn({
              assert: (cond, msg) => {
                if (!cond) throw new Error(`Assertion failed: ${msg}`);
                t.details.push(`✓ ${msg}`);
              },
              assertEqual: (actual, expected, msg) => {
                if (actual !== expected) {
                  throw new Error(`Assertion failed: ${msg} (expected: ${JSON.stringify(expected)}, actual: ${JSON.stringify(actual)})`);
                }
                t.details.push(`✓ ${msg} === ${JSON.stringify(expected)}`);
              },
              assertNear: (actual, expected, tolerance, msg) => {
                if (Math.abs(actual - expected) > tolerance) {
                  throw new Error(`Assertion failed: ${msg} (|${actual} - ${expected}| > ${tolerance})`);
                }
                t.details.push(`✓ ${msg} ≈ ${expected} (actual: ${actual})`);
              },
              log: (msg) => {
                t.details.push(`ℹ ${msg}`);
              }
            });
            t.status = 'PASSED';
          } catch (err) {
            t.status = 'FAILED';
            t.error = err.message || String(err);
            allPass = false;
          } finally {
            t.duration = Math.round(performance.now() - start);
            if (onUpdate) onUpdate();
          }
        }
        this.status = allPass ? 'PASSED' : 'FAILED';
        if (onUpdate) onUpdate();
      }
    }

    // Helper to create a fresh terminal instance in sandbox
    function createTestTerminal(options = {}) {
      const host = document.getElementById('terminal-host');
      host.innerHTML = '';
      const opts = Object.assign({
        fontFamily: "'Cascadia Code', Consolas, 'Segoe UI', monospace",
        fontSize: 14,
        lineHeight: 1.15,
        cursorBlink: false,
        cursorStyle: 'block',
        allowProposedApi: true,
        rescaleOverlappingGlyphs: true,
        cols: 80,
        rows: 24
      }, options);

      const term = new Terminal(opts);
      if (window.Unicode11Addon) {
        const u11 = new Unicode11Addon.Unicode11Addon();
        term.loadAddon(u11);
        term.unicode.activeVersion = '11';
      }
      term.open(host);
      return term;
    }

    function writeAsync(term, data) {
      return new Promise((resolve) => {
        term.write(data, () => resolve());
      });
    }

    // Helper: inspect cell from xterm buffer (using public getCell or internal loadCell)
    function inspectCell(term, row, col) {
      const line = term.buffer.active.getLine(row);
      if (!line) return null;
      const cell = line.getCell(col);
      if (!cell) return null;
      return {
        col: col,
        char: cell.getChars(),
        width: cell.getWidth(),
        code: cell.getCode()
      };
    }

    // --- Build Test Suites ---
    const suites = [];

    // =========================================================================
    // SUITE 1: TC-M1-01 CJK Character Width & Logic Column Alignment
    // =========================================================================
    const s1 = new TestSuite('TC-M1-01', 'CJK 字宽与逻辑列对齐 (CJK Width & Column Alignment)');
    s1.addTest('TC-M1-01-A: Pure CJK "中文测试" Cursor & Double-Cell Allocation', async (ctx) => {
      const term = createTestTerminal();
      await writeAsync(term, '中文测试');

      // Assert cursor column is exactly 8 (4 wide chars * 2 cols)
      ctx.assertEqual(term.buffer.active.cursorX, 8, 'Cursor X position after "中文测试"');
      ctx.assertEqual(term.buffer.active.cursorY, 0, 'Cursor Y position');

      // Deep cell memory checks: wide characters must occupy width 2 at col N, width 0 at col N+1
      const expectedChars = ['中', '文', '测', '试'];
      for (let i = 0; i < 4; i++) {
        const leadCol = i * 2;
        const trailCol = leadCol + 1;
        const leadCell = inspectCell(term, 0, leadCol);
        const trailCell = inspectCell(term, 0, trailCol);

        ctx.assertEqual(leadCell.char, expectedChars[i], `Col ${leadCol} character`);
        ctx.assertEqual(leadCell.width, 2, `Col ${leadCol} wide-cell width`);
        ctx.assertEqual(trailCell.width, 0, `Col ${trailCol} continuation-cell width`);
      }
      term.dispose();
    });

    s1.addTest('TC-M1-01-B: Mixed ASCII & CJK "A中B文C测D试E" Strict 13-Column Alignment', async (ctx) => {
      const term = createTestTerminal();
      await writeAsync(term, 'A中B文C测D试E');

      // Total width: 1 + 2 + 1 + 2 + 1 + 2 + 1 + 2 + 1 = 13
      ctx.assertEqual(term.buffer.active.cursorX, 13, 'Cursor X position after mixed ASCII & CJK');

      const expectedLayout = [
        { col: 0, char: 'A', width: 1 },
        { col: 1, char: '中', width: 2 },
        { col: 2, char: '', width: 0 },
        { col: 3, char: 'B', width: 1 },
        { col: 4, char: '文', width: 2 },
        { col: 5, char: '', width: 0 },
        { col: 6, char: 'C', width: 1 },
        { col: 7, char: '测', width: 2 },
        { col: 8, char: '', width: 0 },
        { col: 9, char: 'D', width: 1 },
        { col: 10, char: '试', width: 2 },
        { col: 11, char: '', width: 0 },
        { col: 12, char: 'E', width: 1 }
      ];

      for (const exp of expectedLayout) {
        const c = inspectCell(term, 0, exp.col);
        ctx.assertEqual(c.width, exp.width, `Col ${exp.col} cell width`);
        if (exp.char) {
          ctx.assertEqual(c.char, exp.char, `Col ${exp.col} cell char`);
        }
      }
      term.dispose();
    });

    s1.addTest('TC-M1-01-C: Emoji Double-Width with Unicode 11', async (ctx) => {
      const term = createTestTerminal();
      // Write 3 emojis: 🚀 (Rocket, U+1F680), 🎉 (Party, U+1F389), 🔥 (Fire, U+1F525)
      await writeAsync(term, '🚀🎉🔥');

      // In Unicode 11, each emoji has width 2 => 3 * 2 = 6
      ctx.assertEqual(term.buffer.active.cursorX, 6, 'Cursor X position after 3 emojis');
      for (let i = 0; i < 3; i++) {
        const col = i * 2;
        const lead = inspectCell(term, 0, col);
        const trail = inspectCell(term, 0, col + 1);
        ctx.assertEqual(lead.width, 2, `Emoji ${i} lead cell width`);
        ctx.assertEqual(trail.width, 0, `Emoji ${i} continuation cell width`);
      }
      term.dispose();
    });

    s1.addTest('TC-M1-01-D: Right Margin Boundary Wrapping for CJK (No Split Glyphs)', async (ctx) => {
      const term = createTestTerminal({ cols: 10 });
      // Write 9 ASCII characters, then a 2-width CJK character '中'
      // 9 chars fill col 0..8. '中' needs 2 cols, cannot fit in col 8..9 without overflowing -> must wrap to next row col 0
      await writeAsync(term, '123456789中');

      ctx.assertEqual(term.buffer.active.cursorY, 1, 'Cursor wrapped to row 1');
      ctx.assertEqual(term.buffer.active.cursorX, 2, 'Cursor X on row 1 is at col 2');

      const row0col8 = inspectCell(term, 0, 8);
      ctx.assertEqual(row0col8.char, '9', 'Row 0 Col 8 is 9');

      const row1col0 = inspectCell(term, 1, 0);
      const row1col1 = inspectCell(term, 1, 1);
      ctx.assertEqual(row1col0.char, '中', 'Row 1 Col 0 contains wrapped CJK 中');
      ctx.assertEqual(row1col0.width, 2, 'Row 1 Col 0 width is 2');
      ctx.assertEqual(row1col1.width, 0, 'Row 1 Col 1 width is 0');
      term.dispose();
    });
    suites.push(s1);

    // =========================================================================
    // SUITE 2: TC-M1-02 Nerd Font / Powerline Overlap & Ghost Elimination
    // =========================================================================
    const s2 = new TestSuite('TC-M1-02', 'Powerline/Nerd 符号防溢出与退格残影消除 (Powerline & Backspace)');
    s2.addTest('TC-M1-02-A: Starship / Powerline Glyphs With rescaleOverlappingGlyphs', async (ctx) => {
      const term = createTestTerminal({ rescaleOverlappingGlyphs: true });
      // \ue0b0 is Powerline right arrow, \ue0a0 is Git branch symbol
      await writeAsync(term, '\ue0b0\ue0a0OK');

      // \ue0b0 and \ue0a0 in Unicode 11 PUA have width 1
      ctx.assertEqual(term.buffer.active.cursorX, 4, 'Cursor X position after Powerline glyphs + OK');
      const c0 = inspectCell(term, 0, 0);
      const c1 = inspectCell(term, 0, 1);
      const c2 = inspectCell(term, 0, 2);
      const c3 = inspectCell(term, 0, 3);

      ctx.assertEqual(c0.width, 1, 'Powerline glyph \ue0b0 cell width is 1');
      ctx.assertEqual(c1.width, 1, 'Powerline glyph \ue0a0 cell width is 1');
      ctx.assertEqual(c2.char, 'O', 'Col 2 char is O without collision');
      ctx.assertEqual(c3.char, 'K', 'Col 3 char is K');
      term.dispose();
    });

    s2.addTest('TC-M1-02-B: Backspace Over Mixed CJK & Symbols Ghost Residue Check', async (ctx) => {
      const term = createTestTerminal();
      // Write: "git:\ue0a0master 中文"
      // "git:" (4) + \ue0a0 (1) + "master" (6) + " " (1) + "中文" (4) = 16 cols
      await writeAsync(term, 'git:\ue0a0master 中文');
      ctx.assertEqual(term.buffer.active.cursorX, 16, 'Cursor X at col 16');

      // Perform terminal backspace erasing the last 5 characters:
      // In shell, backspacing "中文" (2 CJK chars = 4 cols) + space (1 col) = 5 cols
      // VT erase: send 5 backspaces + space overwrite + 5 backspaces, or \b\b\b\b\b\x1b[K
      await writeAsync(term, '\b\b\b\b\b\x1b[K');
      ctx.assertEqual(term.buffer.active.cursorX, 11, 'Cursor X after backspacing 5 columns is at 11');

      // Write replacement "dev"
      await writeAsync(term, 'dev');
      ctx.assertEqual(term.buffer.active.cursorX, 14, 'Cursor X after writing dev is 14');

      // Now audit line buffer for orphan half-characters and ghost residue:
      // Line should be: "git:\ue0a0masterdev" followed by blank cells
      const line = term.buffer.active.getLine(0);
      const lineStr = line.translateToString(true);
      ctx.assertEqual(lineStr, 'git:\ue0a0masterdev', 'Line content after backspace and overwrite');

      // Adversary check: Scan all cells in line 0. NO orphaned continuation cell (width=0) must exist!
      for (let col = 0; col < term.cols; col++) {
        const c = line.getCell(col);
        if (c.getWidth() === 0) {
          ctx.assert(col > 0, `Width 0 cell at col ${col} cannot be the first column`);
          const prev = line.getCell(col - 1);
          ctx.assertEqual(prev.getWidth(), 2, `Preceding cell at col ${col - 1} must be wide character`);
        }
      }
      ctx.log('Passed orphan half-cell integrity scan across all 80 columns');
      term.dispose();
    });
    suites.push(s2);

    // =========================================================================
    // SUITE 3: TC-M1-03 Asynchronous Web Font Loading Race Condition
    // =========================================================================
    const s3 = new TestSuite('TC-M1-03', '异步字体加载时序竞争验证 (Asynchronous Web Font Loading)');
    s3.addTest('TC-M1-03-A: document.fonts.ready Geometry Measurement & Auto-Heal', async (ctx) => {
      const term = createTestTerminal();
      await document.fonts.ready;
      ctx.log('document.fonts.ready resolved successfully');

      // Check internal charSizeService measurement
      const charSizeService = term._core ? term._core._charSizeService : null;
      ctx.assert(!!charSizeService, 'CharSizeService exists on terminal core');

      const widthBefore = charSizeService.width;
      const heightBefore = charSizeService.height;
      ctx.assert(widthBefore > 0, `Initial character width > 0 (measured: ${widthBefore}px)`);
      ctx.assert(heightBefore > 0, `Initial character height > 0 (measured: ${heightBefore}px)`);

      // Trigger remeasurement explicitly as required by specification on font ready
      charSizeService.measure();

      const widthAfter = charSizeService.width;
      const heightAfter = charSizeService.height;
      ctx.assert(widthAfter > 0, `Calibrated character width > 0 (measured: ${widthAfter}px)`);
      ctx.assert(heightAfter > 0, `Calibrated character height > 0 (measured: ${heightAfter}px)`);

      // Mount FitAddon and fit to host as done in production syncAllSizes
      const fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      fitAddon.fit();

      // Ensure geometry consistency: rows and cols must be valid integers and cell dimensions non-zero
      ctx.assert(term.cols >= 10, `Terminal cols valid after fit: ${term.cols}`);

    // MILESTONE 2: TERMINAL RESIZE DEBOUNCER & VIEWPORT ADAPTATION SUITES
    // =========================================================================
    class LocalResizeDebouncer {
      constructor(onResize) {
        this._onResize = onResize;
        this._latest = new Map();
        this._lastFired = new Map();
        this._timers = new Map();
      }

      resize(id, cols, rows, immediate = false) {
        if (isNaN(cols) || isNaN(rows) || cols <= 0 || rows <= 0) return;
        const last = this._lastFired.get(id);
        if (last && last.cols === cols && last.rows === rows) return;

        this._latest.set(id, { cols, rows });

        if (immediate) {
          this.flush(id);
          return;
        }

        const colsChanged = !last || last.cols !== cols;
        const delay = colsChanged ? 100 : 16;

        if (this._timers.has(id)) {
          clearTimeout(this._timers.get(id));
        }

        const timer = setTimeout(() => {
          this._timers.delete(id);
          this.flush(id);
        }, delay);
        this._timers.set(id, timer);
      }

      flush(id) {
        if (this._timers.has(id)) {
          clearTimeout(this._timers.get(id));
          this._timers.delete(id);
        }
        const target = this._latest.get(id);
        if (!target) return;
        const last = this._lastFired.get(id);
        if (last && last.cols === target.cols && last.rows === target.rows) return;
        this._lastFired.set(id, { cols: target.cols, rows: target.rows });
        this._onResize(id, target);
      }

      flushAll() {
        for (const id of this._latest.keys()) {
          this.flush(id);
        }
      }

      clear(id) {
        if (this._timers.has(id)) {
          clearTimeout(this._timers.get(id));
          this._timers.delete(id);
        }
        this._latest.delete(id);
        this._lastFired.delete(id);
      }
    }

    // MILESTONE 3: ACK FLOW CONTROL & BACKPRESSURE TEST SUITES
    // =========================================================================
    class MockAckFlowController {
      constructor(onAck) {
        this._onAck = onAck;
        this.pendingAckBytes = 0;
        this.ackTimer = null;
        this.totalAcked = 0;
      }

      ackData(bytes) {
        this.pendingAckBytes += bytes;
        if (this.pendingAckBytes >= 16384) {
          this.flush();
        } else if (!this.ackTimer) {
          this.ackTimer = setTimeout(() => {
            this.flush();
          }, 16);
        }
      }

      flush() {
        if (this.ackTimer) {
          clearTimeout(this.ackTimer);
          this.ackTimer = null;
        }
        const b = this.pendingAckBytes;
        if (b > 0) {
          this.pendingAckBytes = 0;
          this.totalAcked += b;
          if (this._onAck) this._onAck(b);
        }
      }
    }

        await new Promise((resolve) => {
          term.write(chunk, () => {

            resolve();
          });
        });
      }

      ackController.flush();

      ctx.log(`Total Input Bytes: ${totalInputBytes} bytes, Total ACK Confirmed: ${hostAckReceived} bytes`);
      ctx.assertEqual(hostAckReceived, totalInputBytes, 'Total ACKed bytes strictly equals input bytes (0 drift, 0 loss)');

    s14.addTest('TC-M3-02-A: High/Low Watermark Sliding Window Backpressure (In-flight <= 64KB)', async (ctx) => {
      const term = createTestTerminal({ cols: 80, rows: 24, scrollback: 1000 });
      const HIGH_WATERMARK = 65536; // 64KB
      const LOW_WATERMARK = 16384;  // 16KB

      let inFlightBytes = 0;
      let maxInFlightObserved = 0;
      let pauseCount = 0;
      let resumeCount = 0;
      let isPaused = false;
      let unthrottleResolver = null;

      const ackController = new MockAckFlowController((acked) => {
        inFlightBytes = Math.max(0, inFlightBytes - acked);
        if (isPaused && inFlightBytes <= LOW_WATERMARK) {
          isPaused = false;
          resumeCount++;
          if (unthrottleResolver) {
            const r = unthrottleResolver;
            unthrottleResolver = null;
            r();
          }
        }
      });

      const totalRounds = 300;
      for (let i = 0; i < totalRounds; i++) {
        const chunkSize = 2048; // 2KB chunks
        const chunk = `[Packet #${i}] Data burst testing sliding window backpressure constraints.\r\n`;
        const bytes = chunkSize;

        if (inFlightBytes + bytes > HIGH_WATERMARK) {
          isPaused = true;
          pauseCount++;
          await new Promise((r) => { unthrottleResolver = r; });
        }

        inFlightBytes += bytes;
        if (inFlightBytes > maxInFlightObserved) {
          maxInFlightObserved = inFlightBytes;
        }

        term.write(chunk, () => {
          ackController.ackData(bytes);
        });
      }

      while (inFlightBytes > 0) {
        ackController.flush();
        await new Promise((r) => setTimeout(r, 20));
      }

      ctx.log(`Max In-Flight Observed: ${maxInFlightObserved} bytes (Limit: ${HIGH_WATERMARK}), Pauses: ${pauseCount}, Resumes: ${resumeCount}`);
      ctx.assert(maxInFlightObserved <= HIGH_WATERMARK, `Max in-flight bytes (${maxInFlightObserved}) <= ${HIGH_WATERMARK} (zero overflow/flood)`);
      ctx.assert(pauseCount > 0, `Backpressure throttle paused transmission ${pauseCount} times`);
      ctx.assert(resumeCount > 0, `Unthrottle resumed transmission ${resumeCount} times when below low watermark`);
      term.dispose();
    });

    s14.addTest('TC-M3-03-A: User Interaction Responsiveness Under Heavy Data Storm (Latency <= 30ms)', async (ctx) => {
      const term = createTestTerminal({ cols: 80, rows: 24, scrollback: 1000 });

    s14.addTest('TC-M3-04-A: End-to-End Stream Data Integrity & Sequence Strict Ordering', async (ctx) => {
      const term = createTestTerminal({ cols: 80, rows: 24, scrollback: 1000 });

          if (str.startsWith('SEQ_')) {

          }
        }
      }

      ctx.log(`Sent markers: ${sentSequence.length}, Retrieved in buffer: ${retrieved.length}`);
      ctx.assert(retrieved.length >= 24, 'Terminal active buffer contains expected tail lines');

      const lastSent = sentSequence[sentSequence.length - 1];

      let inOrder = true;
      for (let k = 1; k < retrieved.length; k++) {

    // =========================================================================
    function createSmartKeyHandler(term, onCopy, onPaste) {
      return (e) => {
        if (e.type === 'keydown') {
          // F5 reload block
          if (e.key === 'F5') {
            e.preventDefault();
            return false;
          }
          // Ctrl+R reverse search (prevent browser reload, pass to shell)
          if (e.ctrlKey && !e.altKey && !e.metaKey && (e.key === 'r' || e.key === 'R')) {
            e.preventDefault();
            return true;
          }
          // Ctrl+P previous command (prevent browser print, pass to shell)
          if (e.ctrlKey && !e.altKey && !e.metaKey && (e.key === 'p' || e.key === 'P')) {
            e.preventDefault();
            return true;
          }
          // Ctrl+F find window placeholder (prevent browser find)
          if (e.ctrlKey && !e.altKey && !e.metaKey && (e.key === 'f' || e.key === 'F')) {
            e.preventDefault();
            return false;
          }
          // Ctrl+V paste
          if (e.ctrlKey && !e.altKey && !e.metaKey && (e.key === 'v' || e.key === 'V')) {
            if (onPaste) onPaste();
            return false;
          }
          // Ctrl+C smart copy vs interrupt
          if (e.ctrlKey && !e.altKey && !e.metaKey && (e.key === 'c' || e.key === 'C')) {
            if (term.hasSelection()) {
              const sel = term.getSelection();
              if (onCopy) onCopy(sel);
              term.clearSelection();
              return false;
            }
            return true;
          }
        }
        return true;
      };
    }

    function createMouseTrackingHandler(term, onPaste) {
      return {
        onMouseDown: (e) => {
          const isTracking = term.modes?.mouseTrackingMode && term.modes.mouseTrackingMode !== 'none';
          if (e.button === 2) {
            if (isTracking && !e.shiftKey) {
              return; // Let xterm handle SGR mouse report
            }
            e.stopPropagation();
          }
        },
        onContextMenu: (e) => {
          e.preventDefault();
          const isTracking = term.modes?.mouseTrackingMode && term.modes.mouseTrackingMode !== 'none';
          if (isTracking && !e.shiftKey) {
            return; // Do NOT paste in tracking mode without Shift
          }
          if (onPaste) onPaste();
        }
      };
    }

          <button id="find-btn-prev" class="action-btn" title="上一个匹配项 (Shift+Enter)">▲</button>
          <button id="find-btn-next" class="action-btn" title="下一个匹配项 (Enter)">▼</button>
          <button id="find-btn-close" class="action-btn" title="关闭 (Escape)">✕</button>
        </div>
      `;
      host.appendChild(widget);

      const findInput = widget.querySelector('#find-input');
      const btnClose = widget.querySelector('#find-btn-close');

      function showFindWidget() {
        widget.classList.remove('hidden');
        if (term.hasSelection()) {
          const sel = term.getSelection();
          if (sel && !sel.includes('\n') && !sel.includes('\r')) {
            findInput.value = sel;
            findInput.select();
          }
        }
        findInput.focus();
      }

      function hideFindWidget() {
        widget.classList.add('hidden');
        term.focus();
      }

      // Event isolation on Find Widget
      widget.addEventListener('keydown', (e) => {
        e.stopPropagation();
        if (e.key === 'Escape') {
          e.preventDefault();
          hideFindWidget();
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (e.shiftKey) {
            searchAddon.findPrevious(findInput.value);
          } else {
            searchAddon.findNext(findInput.value);
          }
        }
      });
      widget.addEventListener('keypress', (e) => e.stopPropagation());
      widget.addEventListener('keyup', (e) => e.stopPropagation());
      btnClose.addEventListener('click', () => hideFindWidget());

      // Write sample text and select "HelloPuTTY"
      await writeAsync(term, 'HelloPuTTY and Welcome to VS Code Terminal Search\r\n');
      term.select(0, 0, 10);

      ctx.assert(term.hasSelection(), 'Active selection exists in terminal');
      ctx.assertEqual(term.getSelection(), 'HelloPuTTY', 'Selection matches "HelloPuTTY"');

      // 1. Simulate Ctrl+F key event
      let ctrlFIntercepted = false;
      const keyHandler = (e) => {
        if (e.type === 'keydown' && e.ctrlKey && !e.altKey && !e.metaKey && (e.key === 'f' || e.key === 'F')) {
          e.preventDefault();
          ctrlFIntercepted = true;
          showFindWidget();
          return false;
        }
        return true;
      };
      term.attachCustomKeyEventHandler(keyHandler);

      const ctrlFEvent = new KeyboardEvent('keydown', {
        key: 'f',
        code: 'KeyF',
        ctrlKey: true,
        bubbles: true,
        cancelable: true
      });
      term.textarea.dispatchEvent(ctrlFEvent);

      ctx.assert(ctrlFIntercepted, 'Ctrl+F intercepted by terminal key handler');
      ctx.assert(!widget.classList.contains('hidden'), 'Find Widget is now visible');
      ctx.assertEqual(findInput.value, 'HelloPuTTY', 'Find Input is auto-prefilled with active selection');
      ctx.assertEqual(document.activeElement, findInput, 'Find Input is currently focused');

      // 2. Event isolation & zero buffer pollution test
      let terminalReceivedData = '';
      term.onData((data) => {
        terminalReceivedData += data;
      });

      // Type "test" inside findInput
      const inputCharEvent = new KeyboardEvent('keydown', {
        key: 't',
        code: 'KeyT',
        bubbles: true,
        cancelable: true
      });
      findInput.dispatchEvent(inputCharEvent);

      ctx.assertEqual(terminalReceivedData, '', 'Typing in Find Widget input causes ZERO data leakage into terminal buffer');

      // 3. Escape key lifecycle & focus restoration
      const escEvent = new KeyboardEvent('keydown', {
        key: 'Escape',
        code: 'Escape',
        bubbles: true,
        cancelable: true
      });
      findInput.dispatchEvent(escEvent);

      ctx.assert(widget.classList.contains('hidden'), 'Escape key hides Find Widget');
      ctx.assertEqual(document.activeElement, term.textarea, 'Focus smoothly returned to terminal textarea');

      // Cleanup
      widget.remove();
      searchAddon.dispose();
      term.dispose();
      host.innerHTML = '';
    });

    suites.push(s16);

    // =========================================================================
    // SUITE 17: TC-PS-01..03 本地 PowerShell 与 WSL 终端扩展集成
    // =========================================================================
    const s17 = new TestSuite('TC-PS-01..03', '本地 PowerShell 与 WSL 终端扩展集成 (Local PowerShell & WSL Integration)');

    // TC-PS-01-A: New Tab Context Menu DOM & Action Attribute Verification
    s17.addTest('TC-PS-01-A: New Tab Menu DOM & Action Attribute Verification', async (ctx) => {
      const newTabActions = ['new-powershell', 'new-wsl', 'new'];
      ctx.assert(newTabActions.includes('new-powershell'), 'Action "new-powershell" is recognized');
      ctx.assert(newTabActions.includes('new-wsl'), 'Action "new-wsl" is recognized');

      let dispatchedAction = null;
      const fakeSendToHost = (type, payload) => {
        dispatchedAction = { type, payload };
      };

      const handleAction = (act) => {
        if (act === 'new-powershell') fakeSendToHost('3', 'new_tab_powershell');
        else if (act === 'new-wsl') fakeSendToHost('3', 'new_tab_wsl');
        else if (act === 'new') fakeSendToHost('3', 'new_tab');
      };

      handleAction('new-powershell');
      ctx.assertEqual(dispatchedAction.type, '3', 'Host message type is 3');
      ctx.assertEqual(dispatchedAction.payload, 'new_tab_powershell', 'Host message payload is new_tab_powershell');

      handleAction('new-wsl');
      ctx.assertEqual(dispatchedAction.payload, 'new_tab_wsl', 'Host message payload is new_tab_wsl');
    });

    // TC-PS-02-A: ConPTY PowerShell & WSL Command Line Synthesis
    s17.addTest('TC-PS-02-A: ConPTY PowerShell & WSL Command Line Synthesis', async (ctx) => {
      const buildConptyCmd = (proto, host, remoteCmd) => {
        if (remoteCmd && remoteCmd.length > 0) return remoteCmd;
        if (proto === 'powershell') {
          if (host && host.length > 0 && !['powershell', 'pwsh', 'local', 'localhost', '127.0.0.1'].includes(host.toLowerCase())) {
            return `powershell.exe -NoLogo ${host}`;
          }
          return 'powershell.exe -NoLogo';
        }
        if (host && host.length > 0 && !['wsl', 'localhost', '127.0.0.1'].includes(host.toLowerCase())) {
          return `wsl.exe -d ${host} ~`;
        }
        return 'wsl.exe ~';
      };

      ctx.assertEqual(buildConptyCmd('powershell', '', ''), 'powershell.exe -NoLogo', 'Default PowerShell launches powershell.exe -NoLogo');
      ctx.assertEqual(buildConptyCmd('powershell', 'PowerShell', ''), 'powershell.exe -NoLogo', 'Host=PowerShell launches powershell.exe -NoLogo');
      ctx.assertEqual(buildConptyCmd('powershell', '-ExecutionPolicy Bypass', ''), 'powershell.exe -NoLogo -ExecutionPolicy Bypass', 'Custom args appended to powershell.exe');

      ctx.assertEqual(buildConptyCmd('wsl', '', ''), 'wsl.exe ~', 'Default WSL launches wsl.exe ~');
      ctx.assertEqual(buildConptyCmd('wsl', 'Ubuntu', ''), 'wsl.exe -d Ubuntu ~', 'Distro Ubuntu launches wsl.exe -d Ubuntu ~');

      ctx.assertEqual(buildConptyCmd('powershell', '', 'pwsh.exe -NoLogo'), 'pwsh.exe -NoLogo', 'Remote cmd override respected');
    });

    // TC-PS-03-A: Session Name & Type Name Mapping Verification
    s17.addTest('TC-PS-03-A: Session Name & Type Name Mapping Verification', async (ctx) => {
      const getSessionName = (proto, host, rcmd) => {
        if (proto === 'powershell') return 'PowerShell';
        if (proto === 'wsl') {
          if (host && host.length > 0 && !['wsl', 'localhost'].includes(host.toLowerCase())) {
            return `WSL (${host})`;
          }
          return 'WSL';
        }
        return host || 'Session';
      };

      ctx.assertEqual(getSessionName('powershell', 'PowerShell', ''), 'PowerShell', 'PowerShell session name is PowerShell');
      ctx.assertEqual(getSessionName('wsl', 'WSL', ''), 'WSL', 'WSL default session name is WSL');
      ctx.assertEqual(getSessionName('wsl', 'Debian', ''), 'WSL (Debian)', 'WSL Debian session name is WSL (Debian)');
      ctx.assertEqual(getSessionName('ssh', '192.168.1.1', ''), '192.168.1.1', 'SSH session name is host');
    });

    suites.push(s17);

    // --- UI Rendering & Automation Controller ---
    function renderUI() {
      const container = document.getElementById('suites-container');
      container.innerHTML = '';

      let totalTests = 0;
      let totalPassed = 0;
      let totalFailed = 0;

      for (const suite of suites) {
        const suiteEl = document.createElement('div');
        suiteEl.className = 'suite-card';

        let suitePassed = 0;
        let suiteFailed = 0;

        const testItemsHtml = suite.tests.map(t => {
          totalTests++;
          if (t.status === 'PASSED') { suitePassed++; totalPassed++; }
          if (t.status === 'FAILED') { suiteFailed++; totalFailed++; }

          const statusClass = t.status === 'PASSED' ? 'status-pass' : (t.status === 'FAILED' ? 'status-fail' : '');
          const errorHtml = t.error ? `<div class="test-details">FAILED: ${escapeHtml(t.error)}</div>` : '';
          const detailsHtml = t.details.length > 0 ? `<div class="test-meta">${t.details.map(d => escapeHtml(d)).join('<br>')}</div>` : '';

          return `
            <li class="test-item">
              <div class="test-row">
                <div class="test-name">
                  <span>${t.status === 'PASSED' ? '✅' : (t.status === 'FAILED' ? '❌' : '⏳')}</span>
                  <span>${escapeHtml(t.name)}</span>
                </div>
                <div class="test-status ${statusClass}">
                  ${t.status} (${t.duration}ms)
                </div>
              </div>
              ${detailsHtml}
              ${errorHtml}
            </li>
          `;
        }).join('');

        const badgeClass = suite.status === 'PASSED' ? 'badge-pass' : (suite.status === 'FAILED' ? 'badge-fail' : 'badge-running');

        suiteEl.innerHTML = `
          <div class="suite-header">
            <div class="suite-title">
              <span>${suite.id}</span>
              <span>${escapeHtml(suite.title)}</span>
            </div>
            <span class="suite-badge ${badgeClass}">${suite.status} (${suitePassed}/${suite.tests.length})</span>
          </div>
          <ul class="test-list">${testItemsHtml}</ul>
        `;
        container.appendChild(suiteEl);
      }

      document.getElementById('stat-total').innerText = totalTests;
      document.getElementById('stat-passed').innerText = totalPassed;
      document.getElementById('stat-failed').innerText = totalFailed;

      const progress = totalTests > 0 ? Math.round(((totalPassed + totalFailed) / totalTests) * 100) : 0;
      const bar = document.getElementById('progress-bar');
      bar.style.width = `${progress}%`;
      if (totalFailed > 0) {
        bar.classList.add('has-failure');
      } else {
        bar.classList.remove('has-failure');
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    window.runAllTests = async function() {
      const btn = document.getElementById('btn-run');
      btn.disabled = true;
      btn.innerText = 'Running Tests...';
      const overallStart = performance.now();

      renderUI();

      for (const s of suites) {
        await s.run(() => renderUI());
      }

      const totalDuration = Math.round(performance.now() - overallStart);
      document.getElementById('stat-duration').innerText = `${totalDuration}ms`;
      btn.disabled = false;
      btn.innerText = 'Run All Tests';

      // Compile final JSON report for automated callers / headless Edge
      let passCount = 0;
      let failCount = 0;
      const suitesReport = suites.map(s => {
        const tests = s.tests.map(t => {
          if (t.status === 'PASSED') passCount++;
          if (t.status === 'FAILED') failCount++;
          return {
            name: t.name,
            status: t.status,
            duration: t.duration,
            error: t.error,
            details: t.details
          };
        });
        return {
          id: s.id,
          title: s.title,
          status: s.status,
          tests: tests
        };
      });

      const report = {
        total: passCount + failCount,
        passed: passCount,
        failed: failCount,
        duration: totalDuration,
        status: failCount === 0 ? 'PASSED' : 'FAILED',
        timestamp: new Date().toISOString(),
        suites: suitesReport
      };

      window.__TEST_RESULTS__ = report;
      const jsonPre = document.getElementById('test-results-json');
      jsonPre.setAttribute('data-status', report.status);
      jsonPre.textContent = JSON.stringify(report, null, 2);
    };

    window.copyJSONReport = function() {
      if (window.__TEST_RESULTS__) {
        navigator.clipboard.writeText(JSON.stringify(window.__TEST_RESULTS__, null, 2)).then(() => {
          alert('Report copied to clipboard!');
        });
      } else {
        alert('No test results available. Please run tests first.');
      }
    };

    // Auto-execute on load
    window.addEventListener('DOMContentLoaded', () => {
      window.runAllTests();
    });
  </script>
